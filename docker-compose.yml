name: devsecopslab

services:
  app:
    build:
      context: ./app
    image: devsecops-sast-dast-lab-app:local
    container_name: devsecops-vulnerable-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DEMO_API_KEY: dev-demo-from-compose-not-prod
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
